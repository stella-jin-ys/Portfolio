name: Build GitHub Pages site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "_next/**"
      - "projects/**"
      - "favicon.svg"
      - "file.svg"
      - "globe.svg"
      - "window.svg"
      - "stella-jin-profile.png"
      - "_headers"
      - ".assetsignore"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Add the GitHub Pages project path
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";

          const root = path.resolve("dist/client");
          const textExtensions = new Set([".html", ".css", ".js", ".json", ".rsc"]);

          async function visit(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const filePath = path.join(directory, entry.name);
              if (entry.isDirectory()) await visit(filePath);
              else if (textExtensions.has(path.extname(entry.name))) {
                let text = await readFile(filePath, "utf8");
                text = text
                  .replace(/(["'])\/_next\//g, "$1/Portfolio/_next/")
                  .replace(/(["'])\/projects\//g, "$1/Portfolio/projects/")
                  .replace(/(src|href|imageSrcSet)=\"\/(?!Portfolio\/)/g, "$1=\"/Portfolio/")
                  .replace(/url\(\/(?!Portfolio\/)/g, "url(/Portfolio/");
                await writeFile(filePath, text);
              }
            }
          }

          await visit(root);
          NODE

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
